# =============================================================================
# .github/workflows/android-e2e.yml  (ROOT REPOSITORY – lightweight wrapper)
#
# PURPOSE: Entry-point only. Delegates ALL testing logic to:
#   healthLog App/HealthLogAppium/scripts/ci_run_tests.ps1
#
# DO NOT add testing logic here.
# DO NOT duplicate scripts from HealthLogAppium.
# This wrapper only: checks out code, builds the APK, calls the pipeline
# script, collects artifacts, and deploys the HTML report.
# =============================================================================
name: HealthLog Mobile Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-e2e-tests:
    # ── Windows Self-Hosted Runner: HealthLogRunner ──────────────────────────
    runs-on: [self-hosted, Windows, X64, android]

    defaults:
      run:
        shell: powershell

    steps:
      # ── 1. Checkout (with submodules so HealthLogAppium is available) ──────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # ── 2. Build the Android Debug APK (pre-test prerequisite) ────────────
      - name: Build Android Debug APK
        working-directory: "healthLog App"
        run: |
          Write-Host "=== Building HealthLog Android APK ==="
          .\gradlew.bat assembleDebug --no-daemon

      # ── 3. Delegate ALL testing logic to the HealthLogAppium pipeline ─────
      #       ci_run_tests.ps1 owns: npm install, emulator start/check,
      #       Appium start, APK install, WDIO run, all report generation.
      - name: Run HealthLogAppium E2E Pipeline
        working-directory: "healthLog App/HealthLogAppium"
        run: |
          Write-Host "=== Delegating to HealthLogAppium test pipeline ==="
          powershell -File scripts\ci_run_tests.ps1

      # ── 4. Upload every generated artifact ───────────────────────────────
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthlog-appium-test-results-${{ github.run_number }}
          path: "healthLog App/HealthLogAppium/test-results/"
          retention-days: 30

      # ── 5a. Deploy latest HTML report to GitHub Pages ─────────────────────
      - name: Deploy HTML Report to GitHub Pages (latest)
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "healthLog App/HealthLogAppium/test-results/html"
          destination_dir: reports/latest

      # ── 5b. Persist per-build report history ──────────────────────────────
      - name: Deploy Report History to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "healthLog App/HealthLogAppium/test-results/html"
          destination_dir: reports/history/build-${{ github.run_number }}
          keep_files: true
